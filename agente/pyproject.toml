[project]
name = "agente-central-de-salas"
version = "1.0.0"
description = "Agente A2A v1.0 que e host MCP por dentro (sem LLM)"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
